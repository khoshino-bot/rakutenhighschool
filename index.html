<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>かんたん見積システム｜プラン診断士 おしごと体験</title>
<style>
  :root {
    /* PLACZ デザインルール（ライトテーマ）: ネイビー × ゴールド */
    --brand: #c9a84c;          /* Gold: 選択・強調・CTA */
    --brand-dark: #b8942e;     /* Gold Dark */
    --brand-pale: rgba(201, 168, 76, 0.12);
    --seg-plan: #1f3a66;       /* 支払いイメージの帯: プラン（Navy Mid） */
    --seg-opt: #c9a84c;        /*                     オプション（Gold） */
    --seg-dev: #e9dcae;        /*                     製品代金（Gold 薄） */
    --navy: #1a2332;
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --text: #0f172a;
    --sub: #64748b;
    --disabled: #94a3b8;
    --border: #e2e8f0;
    --shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
    --header-h: 72px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    font-size: 16px; line-height: 1.8; letter-spacing: 0.02em;
    word-break: break-all; overflow-wrap: break-word; line-break: strict;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; min-height: 100vh;
  }
  button, select { font: inherit; color: inherit; touch-action: manipulation; }
  button { cursor: pointer; }
  h1, h2, h3 { margin: 0; line-height: 1.3; letter-spacing: 0; }

  /* ===== ヘッダー ===== */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: var(--header-h);
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: env(safe-area-inset-top) calc(20px + env(safe-area-inset-right)) 0 calc(20px + env(safe-area-inset-left));
  }
  .logo { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo .mark {
    width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: #fff;
    font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center; flex: none;
  }
  .logo .name { font-weight: 800; font-size: 20px; color: var(--navy); white-space: nowrap; line-height: 1.2; }
  .logo .name small { display: block; font-size: 12px; font-weight: 600; color: var(--sub); letter-spacing: 0.06em; }
  .btn-reset {
    min-height: 44px; padding: 8px 20px; border-radius: 8px; font-size: 15px; font-weight: 600;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
  }
  .btn-reset:active { background: var(--surface2); }

  /* ===== レイアウト ===== */
  .main {
    max-width: 1400px; margin: 0 auto;
    padding: calc(var(--header-h) + 20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  .cols { display: grid; grid-template-columns: 1.1fr 1.1fr 0.9fr; gap: 20px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); }
  .panel h2 { font-size: 26px; font-weight: 800; margin-bottom: 16px; }
  .label { font-size: 14px; font-weight: 700; color: var(--sub); margin: 20px 0 8px; letter-spacing: 0.04em; }
  .label:first-of-type { margin-top: 0; }
  .note { font-size: 14px; color: var(--sub); line-height: 1.6; }

  /* 選択ボタン（2列） */
  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice-grid.cols3 { grid-template-columns: repeat(3, 1fr); }
  .choice {
    min-height: 56px; padding: 10px 12px; border-radius: 8px; border: 2px solid var(--border);
    background: var(--surface); font-weight: 700; font-size: 16px; line-height: 1.4;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px;
    transition: background 0.1s, border-color 0.1s;
  }
  .choice small { font-size: 13px; font-weight: 500; color: var(--sub); line-height: 1.4; }
  .choice .amt { font-size: 15px; font-weight: 700; }
  .choice.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .choice.on small, .choice.on .amt { color: rgba(255,255,255,0.9); }
  .choice:active { transform: scale(0.98); }
  .choice.big { min-height: 84px; }
  .choice.big .title { font-size: 20px; font-weight: 800; }

  /* 容量ボタン */
  .caps { display: flex; flex-wrap: wrap; gap: 8px; }
  .caps .choice { flex: 1 1 calc(25% - 8px); min-width: 96px; min-height: 60px; }

  /* プランボタン */
  .plan-btn {
    width: 100%; min-height: 72px; border-radius: 8px; border: 2px solid var(--brand); background: var(--brand); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 16px; text-align: center;
  }
  .plan-btn .pn { font-weight: 800; font-size: 20px; line-height: 1.3; }
  .plan-btn { background: var(--navy); border-color: var(--navy); }
  .plan-btn .pr { font-size: 15px; font-weight: 600; opacity: 0.95; }

  /* データ量（3枚） */
  .tiers { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .tier {
    min-height: 64px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface);
    display: flex; flex-direction: row; align-items: center; text-align: left; gap: 12px; width: 100%;
  }
  .tier .gb { font-size: 20px; font-weight: 800; line-height: 1.3; flex: none; width: 88px; }
  .tier .price { font-size: 18px; font-weight: 800; color: var(--navy); line-height: 1.3; flex: none; white-space: nowrap; }
  .tier .hint { font-size: 14px; color: var(--sub); line-height: 1.5; flex: 1; }
  .tier.on { background: var(--brand-pale); border-color: var(--brand); }
  .tier.on .gb { color: var(--brand-dark); }

  /* チェック行 */
  .check {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 8px 12px;
    border: 2px solid transparent; border-radius: 8px; background: transparent; text-align: left;
  }
  .check:active { background: var(--surface2); }
  .check .box {
    flex: none; width: 28px; height: 28px; border-radius: 6px; border: 2px solid #cbd5e1; background: #fff;
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 18px;
  }
  .check.on .box { background: var(--brand); border-color: var(--brand); }
  .check .body { flex: 1; min-width: 0; }
  .check .name { display: block; font-weight: 700; font-size: 17px; line-height: 1.4; }
  .check .desc { display: block; font-size: 14px; color: var(--sub); line-height: 1.5; }
  .check .price { flex: none; font-weight: 800; font-size: 17px; white-space: nowrap; }
  .check.on .price { color: var(--brand-dark); }
  .check .price.minus { color: var(--sub); }
  .check.on .price.minus { color: var(--brand-dark); }

  /* セレクト */
  .select {
    position: relative; width: 100%;
  }
  .select select {
    width: 100%; min-height: 56px; padding: 10px 48px 10px 16px; border-radius: 8px; border: 2px solid var(--border);
    background: var(--surface); font-size: 18px; font-weight: 700; appearance: none; -webkit-appearance: none;
  }
  .select::after {
    content: ''; position: absolute; right: 18px; top: 50%; width: 10px; height: 10px; margin-top: -8px;
    border-right: 3px solid var(--brand); border-bottom: 3px solid var(--brand); transform: rotate(45deg); pointer-events: none;
  }
  .select select:focus { outline: none; border-color: var(--brand); }

  /* 製品カード */
  .device-view { display: flex; gap: 16px; align-items: center; margin-top: 12px; padding: 14px; background: var(--surface2); border-radius: 10px; }
  .device-view .img { flex: none; width: 88px; height: 120px; display: flex; align-items: center; justify-content: center; }
  .device-view .img img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .device-view .img svg { height: 110px; }
  .device-view .dn { font-weight: 800; font-size: 18px; line-height: 1.4; }
  .device-view .dc { font-size: 14px; color: var(--sub); line-height: 1.5; }
  .device-view .dp { font-size: 22px; font-weight: 800; color: var(--navy); line-height: 1.3; margin-top: 4px; }
  .device-view .dp small { font-size: 13px; color: var(--sub); font-weight: 500; margin-left: 4px; }

  /* 支払い内訳 */
  .split { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; border-top: 1px solid var(--border); }
  .split div { padding: 12px 8px 0; text-align: center; }
  .split div + div { border-left: 1px solid var(--border); }
  .split .k { font-size: 13px; font-weight: 700; color: var(--sub); line-height: 1.5; }
  .split .v { font-size: 24px; font-weight: 800; color: var(--navy); line-height: 1.3; }
  .split .v small { font-size: 14px; font-weight: 600; }

  /* パネル下の金額 */
  .panel-total { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); text-align: center; }
  .panel-total .k { font-size: 13px; font-weight: 700; color: var(--sub); }
  .panel-total .v { font-size: 28px; font-weight: 800; color: var(--navy); line-height: 1.3; }
  .panel-total .v small { font-size: 14px; font-weight: 600; }
  .panel-total .v.range { font-size: 22px; color: var(--sub); }

  /* ===== 月々のお支払いイメージ ===== */
  .summary {
    position: sticky; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 900;
    margin-top: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12); padding: 20px 24px;
  }
  .summary .head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .summary h2 { font-size: 26px; font-weight: 800; }
  .summary h2 small { font-size: 13px; font-weight: 500; color: var(--sub); margin-left: 8px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--sub); }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
  .sum-body { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; margin-top: 16px; }
  .bar { height: 56px; display: flex; border-radius: 8px; overflow: hidden; background: var(--surface2); border: 1px solid var(--border); }
  .bar div { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; min-width: 0; padding: 0 6px; }
  .bar .s-plan { background: var(--seg-plan); }
  .bar .s-opt { background: var(--seg-opt); }
  .bar .s-dev { background: var(--seg-dev); color: var(--navy); }
  .bar .s-opt { color: #fff; }
  .bar .s-empty { flex: 1; color: var(--disabled); font-weight: 600; }
  .breakdown { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 12px; font-size: 15px; color: var(--sub); }
  .breakdown b { color: var(--text); font-weight: 700; margin-left: 4px; }
  .breakdown .minus b { color: var(--brand-dark); }
  .total { text-align: right; min-width: 260px; }
  .total .k { font-size: 15px; font-weight: 700; color: var(--sub); }
  .total .v { font-size: 56px; font-weight: 800; color: var(--navy); line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap; }
  .total .v small { font-size: 22px; margin-left: 4px; }
  .total .v.bump { animation: bump 0.25s ease-out; }
  @keyframes bump { 40% { transform: scale(1.05); } }
  .total .extra { margin-top: 8px; font-size: 14px; color: var(--sub); line-height: 1.6; }
  .total .extra b { color: var(--navy); }
  .total .wait { font-size: 18px; font-weight: 700; color: var(--disabled); }

  /* ===== レスポンシブ ===== */
  @media (max-width: 1100px) {
    .cols { grid-template-columns: 1fr 1fr; }
    .cols .panel:nth-child(3) { grid-column: 1 / -1; }
  }
  @media (max-width: 767px) {
    :root { --header-h: 60px; }
    .logo .name { font-size: 17px; }
    .logo .name small { display: none; }
    .main { padding-left: 16px; padding-right: 16px; }
    .cols { grid-template-columns: 1fr; gap: 16px; }
    .cols .panel:nth-child(3) { grid-column: auto; }
    .panel { padding: 18px; }
    .panel h2, .summary h2 { font-size: 22px; }
    .sum-body { grid-template-columns: 1fr; }
    .total { text-align: left; }
    .total .v { font-size: 44px; }
  }

  /* ===== iPad 横向き（4:3）: 3列＋支払いイメージを1画面に収める（スクロールなし） ===== */
  @media (min-width: 900px) and (max-width: 1366px) and (orientation: landscape) {
    :root { --header-h: 60px; }
    .logo .mark { width: 36px; height: 36px; font-size: 18px; }
    .logo .name { font-size: 18px; }
    .main {
      height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 12px;
      padding: calc(var(--header-h) + 12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    }
    .cols { flex: 1; min-height: 0; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: stretch; }
    .cols .panel:nth-child(3) { grid-column: auto; }
    .panel { padding: 16px 18px; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
    .panel h2 { font-size: 22px; margin-bottom: 10px; }
    .label { margin: 12px 0 6px; font-size: 13px; }
    .note { font-size: 13px; }
    .plan-btn { min-height: 60px; padding: 8px 12px; }
    .plan-btn .pn { font-size: 18px; }
    .plan-btn .pr { font-size: 13px; }
    .tiers { gap: 8px; }
    .tier { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 0; min-height: 0; padding: 8px 12px; }
    .tier .gb { width: auto; font-size: 18px; }
    .tier .price { font-size: 17px; text-align: right; }
    .tier .hint { grid-column: 1 / -1; font-size: 12.5px; line-height: 1.45; }
    .select select { min-height: 52px; font-size: 17px; }
    .device-view { gap: 12px; padding: 12px; }
    .device-view .img { width: 64px; height: 92px; }
    .device-view .img svg { height: 84px; }
    .device-view .dn { font-size: 16px; }
    .device-view .dc { font-size: 13px; }
    .device-view .dp { font-size: 20px; }
    .device-view { margin-top: 10px; }
    .device-view .dp small { display: block; margin-left: 0; font-size: 12px; line-height: 1.4; }
    .choice.big { min-height: 58px; padding: 6px 12px; }
    .choice.big .title { font-size: 18px; }
    .split { margin-top: 12px; }
    .split div { padding: 0; border-left: none !important; }
    .split > div { padding: 8px 6px 0; }
    .split > div + div { border-left: 1px solid var(--border) !important; }
    .split .k { font-size: 12px; line-height: 1.4; }
    .split .v { font-size: 20px; }
    .check { gap: 10px; min-height: 48px; padding: 5px 4px; }
    .check .box { width: 26px; height: 26px; }
    .check .name { font-size: 15px; }
    .check .desc { font-size: 12.5px; line-height: 1.45; }
    .check .price { font-size: 15px; }
    .panel-total { margin-top: auto; padding-top: 10px; }
    .panel > :nth-last-child(2) { margin-bottom: 12px; }
    .panel-total .v { font-size: 24px; }
    .panel-total .v.range { font-size: 19px; }
    .summary { position: static; flex: none; margin-top: 0; padding: 12px 20px; }
    .summary h2 { font-size: 21px; }
    .sum-body { margin-top: 8px; gap: 20px; }
    .bar { height: 44px; }
    .breakdown { margin-top: 8px; font-size: 14px; }
    .total { min-width: 220px; }
    .total .v { font-size: 44px; }
    .total .extra { margin-top: 4px; font-size: 13px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="mark">診</div>
    <div class="name">かんたん見積システム<small>プラン診断士 おしごと体験</small></div>
  </div>
  <button class="btn-reset" data-act="reset">最初から</button>
</header>

<main class="main">
  <div class="cols">
    <section class="panel" id="panelPlan"></section>
    <section class="panel" id="panelDevice"></section>
    <section class="panel" id="panelOption"></section>
  </div>
  <section class="summary" id="summary"></section>
</main>

<script>
/* =====================================================================
   ★★ マスタデータ（ここだけ直せば全画面に反映されます） ★★
   ---------------------------------------------------------------------
   投入日: 2026-09-22（2026-09-25 更新：通話かけ放題に改名／48回払いのみ／「製品は買わない」を削除）
   注意 : 金額と名称はすべて「仮の値（体験用のサンプル）」です。店頭で使う最新の公式価格に
          差し替えてから使ってください（税込の整数で入力）。
          製品は「iPhone／Android」の2択、支払いは48回払いのみ。プラン名は独自の名前にしています。
   ===================================================================== */
const MASTER = {

  // ---- プラン（データ量の段階で料金が変わる1つのプラン）----
  plan: {
    name: 'ミライつながるプラン',          // ← プラン名。ここを変えれば全画面に反映
    tiers: [
      { id: 'tier_s', label: '〜3GB',  hint: 'SNSと連絡がメイン。動画はたまに',       price: 1078 },
      { id: 'tier_m', label: '〜20GB', hint: '動画もよく見る。毎日は見ない',           price: 2178 },
      { id: 'tier_l', label: '無制限', hint: '動画を毎日たっぷり。通信量を気にしたくない', price: 3278 },
    ],
  },

  // ---- オプション（複数選択可）----
  options: [
    { id: 'call15',   name: '通話かけ放題',           who: '普通の電話をよくかける人に（アプリ通話は元から無料）', price: 1100 },
    { id: 'warranty', name: 'スマホ保証（故障・紛失）',  who: 'よく落とす・壊しやすい人に',                          price: 1100 },
    { id: 'security', name: 'ウイルス対策',            who: '怪しいサイトやメールが心配な人に',                    price: 220 },
    { id: 'filter',   name: 'あんしんフィルター',        who: '子どものスマホの使い方を保護者が管理したい家庭に',      price: 330 },
    { id: 'remote',   name: '電話でスマホ操作サポート',   who: 'スマホの使い方を電話で教えてほしい人に',               price: 550 },
  ],

  // ---- 製品（iPhone／Android の2択。最初は未選択）----
  // 体験用のダミーデータ。機種を増やしたい場合はここに行を足す（brand は 'iPhone' か 'Android'）。
  // variants を2つ以上入れると容量の選択ボタンが、同じ brand に2機種以上入れると機種のプルダウンが出る。
  devices: [
    { id: 'sample_iphone',  brand: 'iPhone',  name: 'iPhone（サンプル）',  comment: '体験用のサンプル機種です', image: '', pointBack: 0,
      variants: [ { cap: '', price: 140000 } ] },
    { id: 'sample_android', brand: 'Android', name: 'Android（サンプル）', comment: '体験用のサンプル機種です', image: '', pointBack: 0,
      variants: [ { cap: '', price: 60000 } ] },
  ],
  noDeviceLabel: '製品を選んでください',   // 未選択のときの表示（選択肢には出さない）

  // ---- 支払回数（months が 0 のものは一括）。行を足せば選択ボタンが増える ----
  payments: [
    { id: 'p48',  label: '48回払い', months: 48 },
  ],
  defaultPayment: 'p48',
};
/* ====================== マスタここまで ====================== */


/* ===================== 状態（ここから下はロジック） ===================== */
// 画面に出す文字はすべて上の MASTER（このファイル内の固定値）だけ。利用者が文字を入力する欄は無い。
const initialState = () => ({
  tierId: null,
  brand: 'none',                       // 'none' = 製品が未選択 / それ以外は MASTER.devices の brand
  deviceId: null,
  variantIdx: 0,                       // 選択中の容量（variants の添字）
  paymentId: MASTER.defaultPayment,
  options: {},
});
let state = initialState();
let lastTotal = null;
let navLockUntil = 0;

const yen = (n) => Math.max(0, Math.floor(n)).toLocaleString('ja-JP') + '円';
const find = (arr, id) => arr.find((x) => x.id === id) || null;
const brands = [...new Set(MASTER.devices.map((d) => d.brand))];

// 選択中の製品を「機種 + 容量 + 価格」の形で返す（未選択なら null）
function selectedDevice() {
  if (state.brand === 'none') return null;
  const d = find(MASTER.devices, state.deviceId);
  if (!d) return null;
  const v = d.variants[state.variantIdx] || d.variants[0];
  return { ...d, cap: v.cap, price: v.price };
}
function installment(device, paymentId) {
  const pay = find(MASTER.payments, paymentId);
  if (!device || !pay || pay.months === 0) return { monthly: 0, last: 0, months: 0 };
  const monthly = Math.floor(device.price / pay.months);
  return { monthly, last: device.price - monthly * (pay.months - 1), months: pay.months };
}

// 計算式: プラン ＋ オプション ＋ 端末分割 ＝ 月額合計（0円未満は0円）
function calc() {
  const tier = find(MASTER.plan.tiers, state.tierId);
  const planPrice = tier ? tier.price : 0;
  const opts = MASTER.options.filter((o) => state.options[o.id]);
  const optTotal = opts.reduce((s, o) => s + o.price, 0);
  const device = selectedDevice();
  const inst = installment(device, state.paymentId);
  const isLump = !!device && state.paymentId === 'lump';
  return {
    tier, planPrice, opts, optTotal, device, devMonthly: inst.monthly, inst,
    total: Math.max(0, planPrice + optTotal + inst.monthly),
    initialPayment: isLump ? device.price : 0,
    pointBack: device && device.pointBack ? device.pointBack : 0,
  };
}

/* ===================== 描画 ===================== */
const el = (id) => document.getElementById(id);

function render() {
  const c = calc();
  el('panelPlan').innerHTML = viewPlan(c);
  el('panelDevice').innerHTML = viewDevice(c);
  el('panelOption').innerHTML = viewOptions(c);
  el('summary').innerHTML = viewSummary(c);
}

function placeholderPhone(brand) {
  const col = brand === 'iPhone' ? '#1f3a66' : '#334155';
  return `<svg viewBox="0 0 60 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="4" y="2" width="52" height="106" rx="10" fill="${col}"/>
    <rect x="9" y="12" width="42" height="86" rx="5" fill="#f8fafc"/>
    <rect x="22" y="6" width="16" height="3" rx="1.5" fill="#f8fafc" opacity="0.6"/>
  </svg>`;
}

function viewPlan(c) {
  const p = MASTER.plan;
  const min = Math.min(...p.tiers.map((t) => t.price));
  const max = Math.max(...p.tiers.map((t) => t.price));
  const tiers = p.tiers.map((t) => `
    <button class="tier ${state.tierId === t.id ? 'on' : ''}" data-act="tier" data-id="${t.id}">
      <span class="gb">${t.label}</span>
      <span class="price">${yen(t.price)}<span style="font-size:12px;font-weight:600">/月</span></span>
      <span class="hint">${t.hint}</span>
    </button>`).join('');
  const totalRow = c.tier
    ? `<div class="v">${yen(c.planPrice)}<small>/月</small></div>`
    : `<div class="v range">${yen(min)}〜${yen(max)}</div><div class="note">毎月のデータ量を選ぶと金額が決まります</div>`;
  return `
    <h2>料金プラン</h2>
    <div class="label">料金プラン</div>
    <button class="plan-btn" data-act="none"><span class="pn">${p.name}</span><span class="pr">${yen(min)}〜${yen(max)}/月（税込）</span></button>
    <div class="label">毎月どれくらい使う？（データ量）</div>
    <div class="tiers">${tiers}</div>
    <div class="panel-total"><div class="k">プランの月々のお支払い金額</div>${totalRow}</div>`;
}

function viewDevice(c) {
  const brandOpts = [`<option value="none" disabled ${state.brand === 'none' ? 'selected' : ''}>${MASTER.noDeviceLabel}</option>`]
    .concat(brands.map((b) => `<option value="${b}" ${state.brand === b ? 'selected' : ''}>${b}</option>`)).join('');
  const models = MASTER.devices.filter((d) => d.brand === state.brand);
  const opt = (d) => `<option value="${d.id}" ${state.deviceId === d.id ? 'selected' : ''}>${d.name}</option>`;
  const makers = [...new Set(models.map((d) => d.maker).filter(Boolean))];
  const modelOpts = makers.length
    ? makers.map((m) => `<optgroup label="${m}">${models.filter((d) => d.maker === m).map(opt).join('')}</optgroup>`).join('')
    : models.map(opt).join('');
  const modelSel = (state.brand === 'none' || models.length <= 1) ? '' : `
    <div class="select" style="margin-top:10px"><select data-act="model" aria-label="機種">${modelOpts}</select></div>`;
  const d = c.device;
  const base = find(MASTER.devices, state.deviceId);
  const caps = (state.brand !== 'none' && base && base.variants.length > 1) ? `
    <div class="label">容量</div>
    <div class="caps">${base.variants.map((v, i) => `<button class="choice ${state.variantIdx === i ? 'on' : ''}" data-act="variant" data-id="${i}">${v.cap}<small>${yen(v.price)}</small></button>`).join('')}</div>` : '';
  const pays = MASTER.payments.map((p) => {
    let amt = '';
    if (d) amt = p.months === 0 ? yen(d.price) : `${yen(Math.floor(d.price / p.months))}/月`;
    return `<button class="choice big ${state.paymentId === p.id ? 'on' : ''}" data-act="payment" data-id="${p.id}" ${d ? '' : 'disabled style="opacity:.5"'}>
      <span class="title">${p.label}</span>${amt ? `<span class="amt">${amt}</span>` : ''}
    </button>`;
  }).join('');
  let view = '';
  if (d) {
    view = `
      <div class="device-view">
        <div class="img">${d.image ? `<img src="${d.image}" alt="">` : placeholderPhone(d.brand)}</div>
        <div><div class="dn">${d.name}${d.cap ? ' ' + d.cap : ''}</div><div class="dc">${d.comment}</div>
          <div class="dp">${yen(d.price)}<small>本体価格・税込</small></div></div>
      </div>
      <div class="label">お支払い方法</div>
      <div class="choice-grid" style="grid-template-columns:repeat(${MASTER.payments.length}, 1fr)">${pays}</div>`;
    if (c.inst.months) {
      view += `<div class="split">
        <div><div class="k">1〜${c.inst.months - 1}回目のお支払い金額</div><div class="v">${yen(c.inst.monthly)}</div></div>
        <div><div class="k">${c.inst.months}回目のお支払い金額</div><div class="v">${yen(c.inst.last)}</div></div>
      </div>`;
    } else {
      view += `<div class="split"><div><div class="k">初回のお支払い金額（一括）</div><div class="v">${yen(d.price)}</div></div>
        <div><div class="k">月々の製品代金</div><div class="v">0円</div></div></div>`;
    }
    if (d.pointBack) view += `<p class="note" style="margin:12px 0 0">別途 <b>${d.pointBack.toLocaleString('ja-JP')}ポイント</b> 還元（月額には含めていません）</p>`;
  } else {
    view = `<div class="device-view"><div class="img"><svg viewBox="0 0 60 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="4" y="2" width="52" height="106" rx="10" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/></svg></div>
      <div><div class="dn">製品を選んでください</div><div class="dc">上のメニューから iPhone または Android を選ぶと、製品代金が出ます</div></div></div>`;
  }
  return `
    <h2>製品</h2>
    <div class="select"><select data-act="brand" aria-label="製品の種類">${brandOpts}</select></div>
    ${modelSel}
    ${caps}
    ${view}
    <div class="panel-total"><div class="k">製品の月々のお支払い金額</div><div class="v">${yen(c.devMonthly)}<small>/月</small></div></div>`;
}

function viewOptions(c) {
  const opts = MASTER.options.map((o) => `
    <button class="check ${state.options[o.id] ? 'on' : ''}" data-act="option" data-id="${o.id}" aria-pressed="${!!state.options[o.id]}">
      <span class="box">${state.options[o.id] ? '✓' : ''}</span>
      <span class="body"><span class="name">${o.name}</span><span class="desc">${o.who}</span></span>
      <span class="price">${yen(o.price)}</span>
    </button>`).join('');
  return `
    <h2>オプション</h2>
    <p class="note" style="margin:0 0 8px">必要なものだけチェック。なくても大丈夫（複数OK）</p>
    <div>${opts}</div>
    <div class="panel-total"><div class="k">オプションの月々のお支払い金額</div><div class="v">${yen(c.optTotal)}<small>/月</small></div></div>`;
}

function viewSummary(c) {
  const parts = [
    { cls: 's-plan', v: c.planPrice,        label: 'プラン' },
    { cls: 's-opt',  v: c.optTotal,          label: 'オプション' },
    { cls: 's-dev',  v: c.devMonthly,        label: '製品代金' },
  ].filter((p) => p.v > 0);
  const sum = parts.reduce((s, p) => s + p.v, 0);
  const bar = parts.length
    ? parts.map((p) => `<div class="${p.cls}" style="flex:${p.v} 1 0" title="${p.label}">${p.v / sum > 0.22 ? `${p.label} ${yen(p.v)}` : ''}</div>`).join('')
    : `<div class="s-empty">左の「毎月どれくらい使う？」から選ぶと、ここに帯が出ます</div>`;
  const bump = lastTotal !== null && lastTotal !== c.total ? 'bump' : '';
  lastTotal = c.total;
  const extras = [];
  if (c.initialPayment) extras.push(`初回のお支払い（製品一括）<b>${yen(c.initialPayment)}</b>`);
  if (c.pointBack) extras.push(`別途 <b>${c.pointBack.toLocaleString('ja-JP')}ポイント</b> 還元`);
  const totalHtml = c.tier
    ? `<div class="v ${bump}">${yen(c.total)}<small>/月</small></div>`
    : `<div class="wait">データ量を選ぶと月額が出ます</div>`;
  return `
    <div class="head">
      <h2>月々のお支払いイメージ<small>※通話料等別途費用</small></h2>
      <div class="legend"><span><i style="background:var(--seg-plan)"></i>プラン</span><span><i style="background:var(--seg-opt)"></i>オプション</span><span><i style="background:var(--seg-dev)"></i>製品代金</span></div>
    </div>
    <div class="sum-body">
      <div>
        <div class="bar">${bar}</div>
        <div class="breakdown">
          <span>プラン<b>${yen(c.planPrice)}</b></span>
          <span>オプション<b>${yen(c.optTotal)}</b></span>
          <span>製品代金<b>${yen(c.devMonthly)}</b></span>
        </div>
      </div>
      <div class="total" aria-live="polite">
        <div class="k">月々のお支払い金額（税込）</div>
        ${totalHtml}
        ${extras.length ? `<div class="extra">${extras.join('<br>')}</div>` : ''}
      </div>
    </div>`;
}

/* ===================== 操作 ===================== */
function handle(act, id) {
  switch (act) {
    case 'reset': {
      const now = Date.now();
      if (now < navLockUntil) return;
      navLockUntil = now + 400;
      state = initialState(); lastTotal = null; window.scrollTo(0, 0); break;
    }
    case 'tier':     state.tierId = id; break;
    case 'option':   state.options = { ...state.options, [id]: !state.options[id] }; break;
    case 'payment':  if (find(MASTER.payments, id)) state.paymentId = id; break;
    case 'brand': {
      state.brand = id;
      const first = MASTER.devices.find((d) => d.brand === id);
      state.deviceId = first ? first.id : null;
      state.variantIdx = 0;
      break;
    }
    case 'model':    if (find(MASTER.devices, id)) { state.deviceId = id; state.variantIdx = 0; } break;
    case 'variant': {
      const base = find(MASTER.devices, state.deviceId);
      const i = Number(id);
      if (base && base.variants[i]) state.variantIdx = i;
      break;
    }
    default: return;
  }
  render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button[data-act]');
  if (!t || t.disabled) return;
  handle(t.dataset.act, t.dataset.id);
});
document.addEventListener('change', (e) => {
  const t = e.target.closest('select[data-act]');
  if (!t) return;
  handle(t.dataset.act, t.value);
});

// オフライン対応: Webで開いたときだけ Service Worker（sw.js）を登録する。
// 一度開けば会場の Wi-Fi が切れても表示できる。ファイル直開き（file://）では何もしない。
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

render();
</script>
